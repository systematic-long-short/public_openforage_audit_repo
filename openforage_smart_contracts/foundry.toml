[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
libraries = [
    "src/ForageGovernorTimelockGuard.sol:ForageGovernorTimelockMigrationGuard:0x46d318eb6a8c2635599e5b61e07a81c15a11381e",
    "src/libraries/GuardianAuthorityClassifier.sol:GuardianAuthorityClassifier:0xc0ddDAF64759A4C6EC95869B928fB133d4fD300C",
]
fs_permissions = [
    { access = "read", path = "./src" },
    { access = "read", path = "./script" },
    { access = "read-write", path = "./deployments" },
]

[profile.deploy]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 0
via_ir = true
revert_strings = "strip"
bytecode_hash = "none"
libraries = [
    "src/ForageGovernorTimelockGuard.sol:ForageGovernorTimelockMigrationGuard:0x46d318eb6a8c2635599e5b61e07a81c15a11381e",
    "src/libraries/GuardianAuthorityClassifier.sol:GuardianAuthorityClassifier:0xc0ddDAF64759A4C6EC95869B928fB133d4fD300C",
]

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
