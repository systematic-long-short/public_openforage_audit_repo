[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read", path = "./src" },
    { access = "read", path = "./script" },
    { access = "read-write", path = "./deployments" },
]

[profile.deploy]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 0
via_ir = true
revert_strings = "strip"
bytecode_hash = "none"

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
