[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
libraries = [
    "src/ForageGovernorTimelockGuard.sol:ForageGovernorTimelockMigrationGuard:0x15104d103992c9790bc506ebe96f98f2570e7c9f",
    "src/libraries/GuardianAuthorityClassifier.sol:GuardianAuthorityClassifier:0xD194A279dDC19BC479592bA4C677A2961992D8Eb",
]
fs_permissions = [
    { access = "read", path = "./src" },
    { access = "read", path = "./script" },
    { access = "read-write", path = "./deployments" },
]

[profile.deploy]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 0
via_ir = true
revert_strings = "strip"
bytecode_hash = "none"
libraries = [
    "src/ForageGovernorTimelockGuard.sol:ForageGovernorTimelockMigrationGuard:0x15104d103992c9790bc506ebe96f98f2570e7c9f",
    "src/libraries/GuardianAuthorityClassifier.sol:GuardianAuthorityClassifier:0xD194A279dDC19BC479592bA4C677A2961992D8Eb",
]

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
